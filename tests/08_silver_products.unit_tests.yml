tests:
  - name: computes_product_volume_correctly
    model: 08_silver_products.sql
    given:
      - table: bronze.products
        rows:
          - product_id: "p1"
            product_category_name: "beleza_saude"
            product_name_lenght: 40
            product_description_lenght: 200
            product_photos_qty: 4
            product_weight_g: "500"
            product_length_cm: "10"
            product_height_cm: "10"
            product_width_cm: "10"
    expect:
      rows:
        - product_id: "p1"
          product_name_length: 40
          product_description_length: 200
          product_weight_g: 500.0
          product_length_cm: 10.0
          product_height_cm: 10.0
          product_width_cm: 10.0
          product_volume_cm3: 1000.0

  - name: drops_rows_with_null_product_id
    model: 08_silver_products.sql
    given:
      - table: bronze.products
        rows:
          - product_id: null
            product_category_name: "beleza_saude"
            product_name_lenght: 40
            product_description_lenght: 200
            product_photos_qty: 4
            product_weight_g: "500"
            product_length_cm: "10"
            product_height_cm: "10"
            product_width_cm: "10"
    expect:
      rows: []
