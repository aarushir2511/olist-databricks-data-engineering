tests:
  - name: computes_dates_year_month_and_delivery_metrics
    model: 02_silver.sql
    given:
      - table: bronze.orders
        rows:
          - order_id: "o1"
            customer_id: "c1"
            order_status: "delivered"
            order_purchase_timestamp: "2024-01-01T10:00:00"
            order_approved_at: "2024-01-01T11:00:00"
            order_delivered_carrier_date: "2024-01-02T09:00:00"
            order_delivered_customer_date: "2024-01-05T15:00:00"
            order_estimated_delivery_date: "2024-01-10T00:00:00"
    expect:
      rows:
        - order_id: "o1"
          customer_id: "c1"
          order_status: "delivered"
          purchase_year: 2024
          purchase_month: 1
          delivery_days: 4
          delivery_delay_days: -5

  - name: drops_rows_with_null_order_id
    model: 02_silver.sql
    given:
      - table: bronze.orders
        rows:
          - order_id: null
            customer_id: "c1"
            order_status: "delivered"
            order_purchase_timestamp: "2024-01-01T10:00:00"
            order_approved_at: "2024-01-01T11:00:00"
            order_delivered_carrier_date: "2024-01-02T09:00:00"
            order_delivered_customer_date: "2024-01-05T15:00:00"
            order_estimated_delivery_date: "2024-01-10T00:00:00"
    expect:
      rows: []
