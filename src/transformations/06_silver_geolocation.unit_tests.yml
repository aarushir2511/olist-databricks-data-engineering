tests:
  - name: averages_lat_lng_for_same_zip_prefix
    model: 06_silver_geolocation.sql
    given:
      - table: bronze.geolocation
        rows:
          - geolocation_zip_code_prefix: "01001"
            geolocation_lat: -23.55
            geolocation_lng: -46.63
            geolocation_city: "sao paulo"
            geolocation_state: "SP"
          - geolocation_zip_code_prefix: "01001"
            geolocation_lat: -23.56
            geolocation_lng: -46.64
            geolocation_city: "sao paulo"
            geolocation_state: "SP"
    expect:
      rows:
        - geolocation_zip_code_prefix: "01001"
          latitude: -23.555
          longitude: -46.635
          city: "sao paulo"
          state: "SP"
