tests:
  - name: combines_order_items_payments_and_customer_into_one_row
    model: 10_gold_order_analytics.sql
    given:
      - table: silver.orders_clean
        rows:
          - order_id: "o1"
            customer_id: "c1"
            order_status: "delivered"
            purchase_timestamp: "2024-01-01T10:00:00"
            approved_timestamp: "2024-01-01T11:00:00"
            delivered_carrier_timestamp: "2024-01-02T09:00:00"
            delivered_customer_timestamp: "2024-01-05T15:00:00"
            estimated_delivery_timestamp: "2024-01-10T00:00:00"
            purchase_year: 2024
            purchase_month: 1
            delivery_days: 4
            delivery_delay_days: -5
      - table: silver.order_items_enriched
        rows:
          - order_id: "o1"
            order_item_id: "1"
            product_id: "p1"
            seller_id: "s1"
            price: 100.0
            freight_value: 10.0
          - order_id: "o1"
            order_item_id: "2"
            product_id: "p2"
            seller_id: "s1"
            price: 50.0
            freight_value: 5.0
      - table: silver.payments_clean
        rows:
          - order_id: "o1"
            total_payment_value: 165.0
            payment_count: 1
            max_installments: 1
            payment_types: ["credit_card"]
      - table: silver.customers_enriched
        rows:
          - customer_id: "c1"
            customer_unique_id: "u1"
            customer_zip_code_prefix: "01001"
            customer_city: "sao paulo"
            customer_state: "SP"
            latitude: -23.55
            longitude: -46.63
    expect:
      rows:
        - order_id: "o1"
          customer_id: "c1"
          customer_unique_id: "u1"
          order_status: "delivered"
          purchase_year: 2024
          purchase_month: 1
          delivery_days: 4
          delivery_delay_days: -5
          total_items: 2
          total_product_value: 150.0
          total_freight_value: 15.0
          total_payment_value: 165.0
          payment_count: 1
          max_installments: 1
          payment_types: ["credit_card"]
          customer_city: "sao paulo"
          customer_state: "SP"
          latitude: -23.55
          longitude: -46.63
